name: Deploy to GitHub Pages

# Publishes main, but only after every CI check passed for that commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # CI also runs for pull requests; only a push to main may be published.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, even if main has moved on since.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Settings > Secrets and variables > Actions > Variables; empty means the standard colors.
          THEME_COLOR_LIGHT: ${{ vars.THEME_COLOR_LIGHT }}
          THEME_COLOR_DARK: ${{ vars.THEME_COLOR_DARK }}
      - run: npm run test:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
